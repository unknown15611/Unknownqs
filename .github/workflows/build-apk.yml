name: Build and Publish Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    name: Build & Publish Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Prepare Debug Keystore
        run: |
          echo "=== Setting up debug keystore ==="
          KEYSTORE_PATH="./debug.keystore"
          if [ -f "$KEYSTORE_PATH" ]; then
            echo "Keystore already exists at $KEYSTORE_PATH."
          else
            echo "Generating clean debug keystore..."
            keytool -genkeypair \
              -v \
              -keystore "$KEYSTORE_PATH" \
              -alias "androiddebugkey" \
              -keyalg "RSA" \
              -keysize 2048 \
              -validity 10000 \
              -storepass "android" \
              -keypass "android" \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          echo "Keystore ready."

      - name: Build Android Debug APK
        id: build_apk
        run: |
          echo "=== Building Android APK with Gradle ==="
          chmod +x ./gradlew 2>/dev/null || true

          if [ -f "./gradlew" ]; then
            ./gradlew :app:assembleDebug --stacktrace --no-daemon
          else
            gradle :app:assembleDebug --stacktrace --no-daemon
          fi

      - name: Verify APK Output
        id: verify_apk
        run: |
          echo "=== Verifying Built APK ==="
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$APK_PATH" ] && [ -s "$APK_PATH" ]; then
            APK_SIZE=$(stat -c%s "$APK_PATH" 2>/dev/null || stat -f%z "$APK_PATH" 2>/dev/null)
            echo "Verified valid debug APK: $APK_PATH ($APK_SIZE bytes)"
            echo "apk_exists=true" >> "$GITHUB_OUTPUT"
            echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"
          else
            echo "Notice: Standard APK not found at $APK_PATH"
            echo "apk_exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload Debug APK Artifact
        if: steps.verify_apk.outputs.apk_exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn

      - name: Publish APK to GitHub Releases
        if: steps.verify_apk.outputs.apk_exists == 'true'
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          echo "=== Publishing to GitHub Releases ==="
          APK_PATH="${{ steps.verify_apk.outputs.apk_path }}"
          TAG_NAME="v1.0.0-build-${{ github.run_number }}"
          RELEASE_TITLE="Qaidi Share Release Build #${{ github.run_number }}"

          gh release create "$TAG_NAME" "$APK_PATH" \
            --title "$RELEASE_TITLE" \
            --notes "Official automated release build for Qaidi Share." \
            --latest 2>/dev/null || true
          exit 0
